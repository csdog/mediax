appId: local.mediax.desktop
productName: MediaX
publish:
  provider: github
  owner: csdog
  repo: mediax
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - drizzle/**/*.sql
  - drizzle/meta/_journal.json
  - package.json
protocols:
  - name: mediax
    schemes:
      - mediax
fileAssociations:
  - ext: md
    name: Markdown
    description: Markdown document
    role: Editor
  - ext: markdown
    name: Markdown
    description: Markdown document
    role: Editor
  - ext: png
    name: PNG Image
    role: Viewer
  - ext: jpg
    name: JPEG Image
    role: Viewer
  - ext: jpeg
    name: JPEG Image
    role: Viewer
  - ext: webp
    name: WebP Image
    role: Viewer
  - ext: gif
    name: GIF Image
    role: Viewer
  - ext: mp4
    name: MP4 Video
    role: Viewer
  - ext: mov
    name: QuickTime Video
    role: Viewer
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  identity: null
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
linux:
  icon: build/icon.png
  category: Office
  maintainer: MediaX
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
extraResources:
  - from: build/icon.png
    to: icon.png
